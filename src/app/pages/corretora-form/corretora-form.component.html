<div class="container mt-5">

  <h2>Cadastrar Corretora</h2>

  <hr>

  <div class="mb-3">
    <label class="form-label">CNPJ</label>
    <input
      type="text"
      class="form-control"
      [(ngModel)]="cnpj">
  </div>

  <div class="mb-3">
    <label class="form-label">CEP</label>
    <input
      type="text"
      class="form-control"
      [(ngModel)]="cep">
  </div>

  <button class="btn btn-primary" (click)="salvar()">
    Salvar
  </button>

  <a routerLink="/" class="btn btn-secondary ms-2">
    Voltar
  </a>

</div>
