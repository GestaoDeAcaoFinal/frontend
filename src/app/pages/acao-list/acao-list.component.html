<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>Ações Cadastradas</h2>

    <a routerLink="/" class="btn btn-secondary">
      Voltar
    </a>

  </div>

  <table class="table table-striped table-bordered">

    <thead>

    <tr>
      <th>ID</th>
      <th>Ticker</th>
      <th>Empresa</th>
      <th>Mercado</th>
      <th>Moeda</th>
      <th>Cotação</th>
    </tr>

    </thead>

    <tbody>

    <tr *ngFor="let a of acoes">

      <td>{{ a.id }}</td>
      <td>{{ a.ticker }}</td>
      <td>{{ a.nomeEmpresa }}</td>
      <td>{{ a.mercado }}</td>
      <td>{{ a.moeda }}</td>
      <td>{{ a.cotacaoAtual }}</td>

    </tr>

    </tbody>

  </table>

</div>
