<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Corretoras Cadastradas</h2>

    <a routerLink="/" class="btn btn-secondary">
      Voltar
    </a>
  </div>

  <table class="table table-striped table-bordered">

    <thead>
    <tr>
      <th>ID</th>
      <th>CNPJ</th>
      <th>Razão Social</th>
      <th>Cidade</th>
      <th>UF</th>
    </tr>
    </thead>

    <tbody>

    <tr *ngFor="let c of corretoras">

      <td>{{ c.id }}</td>

      <td>{{ c.cnpj }}</td>

      <td>{{ c.razaoSocial }}</td>

      <td>{{ c.cidade }}</td>

      <td>{{ c.uf }}</td>

    </tr>

    </tbody>

  </table>

</div>
