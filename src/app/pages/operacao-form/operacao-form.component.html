<div class="container mt-5">

  <h2>Nova Operação</h2>

  <hr>

  <div class="mb-3">

    <label class="form-label">
      ID da Ação
    </label>

    <input
      type="number"
      class="form-control"
      [(ngModel)]="acaoId">

  </div>

  <div class="mb-3">

    <label class="form-label">
      Quantidade
    </label>

    <input
      type="number"
      class="form-control"
      [(ngModel)]="quantidade">

  </div>

  <div class="mb-3">

    <label class="form-label">
      Tipo
    </label>

    <select
      class="form-control"
      [(ngModel)]="tipoOperacao">

      <option value="COMPRA">
        COMPRA
      </option>

      <option value="VENDA">
        VENDA
      </option>

    </select>

  </div>

  <div
    class="mb-3"
    *ngIf="tipoOperacao === 'VENDA'">

    <label class="form-label">
      Preço de Venda
    </label>

    <input
      type="number"
      step="0.01"
      class="form-control"
      [(ngModel)]="precoVenda">

  </div>

  <button
    class="btn btn-primary"
    (click)="salvar()">

    Salvar

  </button>

  <a
    routerLink="/"
    class="btn btn-secondary ms-2">

    Voltar

  </a>

</div>
